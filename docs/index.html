// ---- 读取二维码链接中的配置（#cfg=...，由后台管理程序生成；兼容 ?cfg= 调试） ----
// 支持两种格式：
//   ① 补丁格式（新，二维码内容小）：{bar, removed:[点位id...], added:[新点位...], modified:{id:点位...}}，在内置点位基础上增删改
//   ② 完整格式（旧，向后兼容）：{bar, points:[...]}，整体替换内置点位
function decodeCfgFromHash(){
  try{
    let s = null;
    const h = location.hash;
    if(h.startsWith('#cfg=')) s = h.slice(5);
    else { const m = location.search.match(/[?&]cfg=([^&]+)/); if(m) s = m[1]; }
    if(!s) return null;
    s = s.replace(/-/g, '+').replace(/_/g, '/');   // URL安全Base64还原
    const json = decodeURIComponent(escape(atob(s)));
    return JSON.parse(json);
  }catch(e){}
  return null;
}
const RAW_CFG = decodeCfgFromHash();
// 合并配置：完整格式 {bar, points, levels?} 直接采用；补丁格式在内置点位基础上删→改→增
function mergeCfg(raw){
  if(!raw) return BUILTIN_CFG;
  if(Array.isArray(raw.points)) return raw;   // 完整格式（远程数据 / 旧版二维码）
  const removed = new Set(raw.removed || []);
  const modified = raw.modified || {};
  const merged = BUILTIN_CFG.points
    .filter(p => !removed.has(p.id))
    .map(p => modified[p.id] ? Object.assign({}, p, modified[p.id], { id:p.id }) : p)
    .concat(raw.added || []);
  return { bar: (raw.bar !== undefined ? raw.bar : BUILTIN_CFG.bar), points: merged, levels: raw.levels };
}

/* ================= ★ 远程数据配置（数据外置：二维码永久不变，改数据即改图） ================= */
// 点位数据托管在 GitHub 仓库的 data.json，地图打开时自动拉取最新数据；拉取失败自动回退内置数据兜底
const REMOTE = {
  enabled: true,
  owner: 'hanjiangmap',               // GitHub 用户名（2026-08 配置完成）
  repo:  'map',        // 仓库名
  branch:'main',
  path:  'data.json'
};
async function loadRemoteCfg(){
  const { owner, repo, branch, path } = REMOTE;
  const bust = '_=' + Date.now();
  const sources = [
    // ① GitHub API 原始内容：无缓存，实时最新
    { url:`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}&${bust}`,
      headers:{ 'Accept':'application/vnd.github.raw+json' } },
    // ②③ jsDelivr CDN 镜像（国内加速备用，发布时已自动刷新缓存）
    { url:`https://cdn.jsdmirror.com/gh/${owner}/${repo}@${branch}/${path}?${bust}` },
    { url:`https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${path}?${bust}` }
  ];
  for(const s of sources){
    try{
      const r = await fetch(s.url, { headers: s.headers || {} });
      if(!r.ok) continue;
      const j = await r.json();
      if(j && Array.isArray(j.points)) return mergeCfg(j);
    }catch(e){}
  }
  return null;
}

// ---- 定位纠偏（浏览器定位 WGS-84 → GCJ-02） ----
const PI = Math.PI, AXIS = 6378245.0, ECC = 0.00669342162296594323;
function tLat(x,y){let r=-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;
  r+=(20*Math.sin(y*PI)+40*Math.sin(y/3*PI))*2/3;
  r+=(160*Math.sin(y/12*PI)+320*Math.sin(y*PI/30))*2/3; return r;}
function tLon(x,y){let r=300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
  r+=(20*Math.sin(6*x*PI)+20*Math.sin(2*x*PI))*2/3;
  r+=(20*Math.sin(x*PI)+40*Math.sin(x/3*PI))*2/3;
  r+=(150*Math.sin(x/12*PI)+300*Math.sin(x/30*PI))*2/3; return r;}
function wgs2gcj(lon,lat){
  if(lon<72.004||lon>137.8347||lat<0.8293||lat>55.8271) return [lon,lat];
  let dLat=tLat(lon-105,lat-35), dLon=tLon(lon-105,lat-35);
  const radLat=lat/180*PI; let m=Math.sin(radLat); m=1-ECC*m*m;
  const sq=Math.sqrt(m);
  dLat=(dLat*180)/((AXIS*(1-ECC))/(m*sq)*PI);
  dLon=(dLon*180)/(AXIS/sq*Math.cos(radLat)*PI);
  return [lon+dLon, lat+dLat];
}

// ================= 救生设备匹配池（救援队 + 水上急救站 + 所有"救生点"类型点位） =================
const RESCUE_DEVICES = STATIONS.map(st => ({ name:st.name, lon:st.lon, lat:st.lat }))
  .concat(POINTS.filter(p=>p.level==='救生点').map(p=>({name:p.name, lon:p.lon, lat:p.lat})));

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000, rad = Math.PI/180;
  const dLat = (lat2-lat1)*rad, dLon = (lon2-lon1)*rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function nearestDevice(glat, glon){
  let best = null, bestD = Infinity;
  RESCUE_DEVICES.forEach(dev => {
    const d = haversine(glat, glon, dev.lat, dev.lon);
    if(d < bestD){ bestD = d; best = dev; }
  });
  return { dev:best, dist:bestD };
}
function fmtDist(m){
  return m < 1000 ? `约 ${Math.round(m)} 米` : `约 ${(m/1000).toFixed(1)} 公里`;
}

// ---- 定位 → 显示蓝点（不改变地图视野）→ 最近救生点路线 + 导航卡片 ----
let meMarker = null, routeLine = null;
function updateRoute(glat, glon){
  if(meMarker) map.removeLayer(meMarker);
  meMarker = L.circleMarker([glat, glon], {
    radius:9, color:'#fff', weight:3, fillColor:'#2563EB', fillOpacity:1
  }).addTo(map).bindPopup('<b>📍 我的位置</b>');

  const { dev, dist } = nearestDevice(glat, glon);
  if(!dev) return;
  if(routeLine) map.removeLayer(routeLine);
  routeLine = L.polyline([[glat, glon], [dev.lat, dev.lon]], {
    color:'#2563EB', weight:4, dashArray:'8 8', opacity:.85
  }).addTo(map);

  document.getElementById('nc-name').textContent = dev.name;
  document.getElementById('nc-dist').textContent = `直线${fmtDist(dist)}`;
  document.getElementById('nc-go').href =
    `https://uri.amap.com/navigation?from=${glon},${glat},${encodeURIComponent('我的位置')}` +
    `&to=${dev.lon},${dev.lat},${encodeURIComponent(dev.name)}` +
    `&mode=walk&policy=1&src=hustsj&coordinate=gaode&callnative=1`;
  document.getElementById('nav-card').classList.add('show');
  document.body.classList.add('nav-on');
}
document.getElementById('nc-close').onclick = function(){
  document.getElementById('nav-card').classList.remove('show');
  document.body.classList.remove('nav-on');
};

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = 'none', 4500);
}

let locating = false;
function startLocate(isManual){
  if(!navigator.geolocation){ if(isManual) alert('您的浏览器不支持定位'); return; }
  if(locating) return; locating = true;
  const opt = { enableHighAccuracy:true, timeout:10000 };
  navigator.geolocation.getCurrentPosition(pos => {
    const [glon, glat] = wgs2gcj(pos.coords.longitude, pos.coords.latitude);
    updateRoute(glat, glon);
    navigator.geolocation.watchPosition(p2 => {
      const [g2lon, g2lat] = wgs2gcj(p2.coords.longitude, p2.coords.latitude);
      updateRoute(g2lat, g2lon);
    }, () => {}, opt);
  }, () => {
    locating = false;
    if(isManual) alert('定位失败，请检查定位权限');
    else toast('无法自动定位：请点击右上角📍并允许定位权限，即可查看到最近救生点的路线');
  }, opt);
}

  div.innerHTML = '📍'; div.title = '我的位置';

};
locateCtl.addTo(map);

// ---- 进入后自动定位（仅显示蓝点和路线，视野始终保持汉江流域全景） ----
// 调试/演示：网址后加 ?debugpos=经度,纬度（GCJ-02）可模拟定位
const dbgPos = new URLSearchParams(location.search).get('debugpos');
if(dbgPos){
  const [dLon, dLat] = dbgPos.split(',').map(Number);
  updateRoute(dLat, dLon);
} else {
  startLocate(false);
}
}   /* ================== boot() 结束 ================== */

/* ---- 启动优先级：#cfg 补丁（后台预览/旧二维码）→ 远程线上数据 → 内置兜底数据 ---- */
if(RAW_CFG){
  boot(mergeCfg(RAW_CFG));
}else if(REMOTE.enabled && REMOTE.owner !== 'YOUR_GITHUB_USERNAME'){
  loadRemoteCfg().then(cfg => boot(cfg || BUILTIN_CFG));
}else{
  boot(BUILTIN_CFG);
}

// ---- 移除平台注入的 "Kimi Agent" 标识 ----
function removeKimiBadge(){
  document.querySelectorAll('a[href*="kimi.com"], iframe[src*="kimi.com"]').forEach(e => e.remove());
  document.querySelectorAll('body *').forEach(e => {
    if (e.childElementCount === 0 && e.textContent.trim() === 'Kimi Agent') {
      let p = e;
      for (let i = 0; i < 5 && p.parentElement && p.parentElement !== document.body; i++) p = p.parentElement;
      p.remove();
    }
  });
}
removeKimiBadge();
setInterval(removeKimiBadge, 500);
new MutationObserver(muts => {
  for(const m of muts) for(const n of m.addedNodes){
    if(n.nodeType===1 && (n.tagName==='A' || n.tagName==='IFRAME')){ removeKimiBadge(); return; }
  }
}).observe(document.body, { childList:true, subtree:true });
</script>
